<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cosmic Void: Neon Orbital Defender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #020308;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    #container {
      position: relative;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
      border-radius: 6px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #060814;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
